# Cabeceras de seguridad de Starter, en un snippet aparte porque nginx NO hereda
# los add_header de un nivel superior en cuanto un bloque hijo define su propio
# add_header (p. ej. Cache-Control en /assets/ y /sw.js). Se 'include' en el
# server Y en cada location que ponga cabeceras propias, para que la CSP y el
# nosniff no se caigan justo sobre el JS ejecutable y el service worker.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: la app es autocontenida (sin CDNs); connect-src same-origin cubre el API
# proxyado. 'unsafe-inline' solo en style-src (estilos de Vue).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'" always;
