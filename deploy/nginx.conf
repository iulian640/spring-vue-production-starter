# Nginx de producción de Sofrito: sirve la PWA y proxya el API.
# Cierra el pendiente de la auditoría "cabeceras de seguridad al desplegar".
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad. OJO: nginx solo hereda add_header si el bloque
    # hijo no tiene ninguno propio; por eso el snippet se re-incluye en cada
    # location que ponga Cache-Control (si no, /assets y /sw.js saldrían sin CSP
    # ni nosniff, justo sobre el código ejecutable).
    include /etc/nginx/security-headers.conf;

    # El API, al backend (la IP real la anexa nginx AL FINAL de X-Forwarded-For;
    # el rate limiting lee el último salto, con confiar-en-proxy=true).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta del router de Vue cae en el index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker no se cachea agresivamente (re-incluye las cabeceras).
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Los assets con hash en el nombre sí, un año (re-incluye las cabeceras).
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
